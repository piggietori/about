      --muted: #6B6B6B;
      --white: #FFFFFF;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      background-image: radial-gradient(circle, rgba(201,185,154,0.22) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }
    .hidden { display: none !important; }

      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .gate-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.05em;
      margin-bottom: 48px;
    }
    .gate-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .gate-input-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 280px;
      max-width: 100%;
    }
    .gate-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--sand);
      border-radius: 0;
      padding: 10px 0;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      color: var(--text);
      text-align: center;
      outline: none;
      letter-spacing: 0.08em;
      transition: border-bottom-color 0.2s;
    }
    .gate-input:focus { border-bottom-color: var(--accent); }
    .gate-input.shake { animation: gate-shake 0.35s ease; }
    @keyframes gate-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    .gate-btn {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: var(--white);
      border: none;
      border-radius: 0;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.2s;
    }
    .gate-btn:hover { background: #234d57; }
    .gate-btn:disabled { opacity: 0.7; cursor: default; }
    .gate-error {
      font-size: 12px;
      color: #b0534a;
      letter-spacing: 0.04em;
      min-height: 18px;
    }
  </style>
</head>

    <p class="gate-logo">Tori Lam</p>
    <p class="gate-label">Enter password to continue</p>

      <button class="gate-btn" id="gate-btn" type="submit">Enter</button>
      <p class="gate-error" id="gate-error" role="alert"></p>
    </form>
